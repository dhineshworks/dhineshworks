name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"        # every day at 00:00 UTC
  workflow_dispatch:           # run manually from the Actions tab
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:

      # 1) Main card (classic template)
      - name: Main metrics card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: dhineshworks
          template: classic
          filename: github-metrics.svg
          config_timezone: Asia/Kolkata
          base: header, activity, community, repositories, metadata
          plugin_introduction: yes
          plugin_introduction_title: yes

      # 2) Isometric commit calendar
      - name: Isometric calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: dhineshworks
          template: classic
          filename: github-metrics-isocalendar.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # 3) Languages
      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: dhineshworks
          template: classic
          filename: github-metrics-languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8

      # 4) Coding habits
      - name: Habits
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: dhineshworks
          template: classic
          filename: github-metrics-habits.svg
          base: ""
          config_timezone: Asia/Kolkata
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_charts: yes

      # 5) Achievements
      - name: Achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: dhineshworks
          template: classic
          filename: github-metrics-achievements.svg
          base: ""
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: detailed
          plugin_achievements_limit: 0

      # 6) Featured repositories (pinned)
      - name: Repositories
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: dhineshworks
          template: classic
          filename: github-metrics-repositories.svg
          base: ""
          plugin_repositories: yes
          plugin_repositories_featured: dhineshworks/dhineshworks

      # 7) GitHub Skyline
      - name: Skyline
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: dhineshworks
          template: classic
          filename: github-metrics-skyline.svg
          base: ""
          plugin_skyline: yes
          plugin_skyline_year: 2026
